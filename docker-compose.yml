services:
  mongo:
    image: mongo:7.0
    container_name: clothing_store_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - clothing_network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping: 1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clothing_store_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB_NAME=clothing_store_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-9a4f2c8d1e3b5a708291f0c2d3e4b5a67890123456789abcdef0123456789abc}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - AI_MOCK_MODE=${AI_MOCK_MODE:-False}
      - STORAGE_BACKEND=local
      - UPLOAD_DIR=uploads
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@clothingstore.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminStrongPass123!}
    volumes:
      - backend_uploads:/app/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - clothing_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clothing_store_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clothing_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  clothing_network:
    driver: bridge

volumes:
  mongo_data:
  backend_uploads:
