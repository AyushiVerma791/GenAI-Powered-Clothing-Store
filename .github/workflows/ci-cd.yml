name: CI/CD Pipeline - GenAI Clothing Store

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: clothing-store-backend
  ECS_CLUSTER: clothing-store-cluster
  ECS_SERVICE: clothing-store-service
  S3_FRONTEND_BUCKET: clothing-store-frontend-bucket
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
  ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}

jobs:
  # =========================================================
  # 1. Automated Testing & Validation (Backend & Frontend)
  # =========================================================
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          export PYTHONPATH=backend
          pytest backend/tests -v --maxfail=1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies & Verify Build
        run: |
          cd frontend
          npm ci
          npm run build

  # =========================================================
  # 2. Build & Deploy to AWS (Triggers only on Main Push)
  # =========================================================
  deploy:
    name: Deploy to AWS (ECS Fargate & S3/CloudFront)
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Secure AWS OIDC Authentication (No long-lived static access keys!)
      - name: Configure AWS Credentials via OIDC
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------- Backend Deployment to ECR & ECS -----------------
      - name: Log in to Amazon ECR
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Backend Image to Amazon ECR
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy Backend to Amazon ECS Fargate
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment

      # ----------------- Frontend Deployment to S3 & CloudFront -----------------
      - name: Build Frontend for Production
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Sync Frontend Artifacts to Amazon S3
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        run: |
          aws s3 sync frontend/dist s3://$S3_FRONTEND_BUCKET --delete

      - name: Invalidate CloudFront CDN Cache
        if: ${{ env.ROLE_TO_ASSUME != '' && env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
            --paths "/*"

      # ----------------- Deployment Verification -----------------
      - name: Verify Backend Deployment Health
        if: ${{ env.ROLE_TO_ASSUME != '' }}
        run: |
          echo "Waiting for ECS service stability..."
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
          echo "Deployment successfully completed and verified!"
